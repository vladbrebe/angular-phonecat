<div class="container-fluid">
  <div class="row">
    <div class="col-md-2">
      <!--Sidebar content-->

      <p>
        Search:
        <input ng-model="$ctrl.query">
      </p>

      <p>
        Sort by:
        <select ng-model="$ctrl.orderProp">
          <option value="name">Alphabetical</option>
          <option value="age">Newest</option>
        </select>
      </p>

    </div>
    <div class="col-md-10">
      <!--Body content-->

        <ul class="phones">
        <li ng-repeat="phone in filteredPhones = ($ctrl.phones | filter:$ctrl.query | orderBy:$ctrl.orderProp) | limitTo:5" class="thumbnail">

            <a href="#!/phones/{{phone.id}}" class="thumb">
            <img ng-src="{{phone.imageUrl}}" alt="{{phone.name}}" />
            </a>
            <a href="#!/phones/{{phone.id}}">{{phone.name}}</a>
            <p>{{phone.snippet}}</p>
        </li>
        </ul>
    
    <!-- In the search bar, type "s"   for 20 results
                                 "sa"  for 6
                                 "sam" for 5-->
    <p ng-if="filteredPhones.length == 6">
        1 more result...
    </p>
    <p ng-if="filteredPhones.length > 6">
        {{filteredPhones.length - 5}} more results...
    </p>
    
    </div>
  </div>
  <pre>{{$ctrl.phones | filter:$ctrl.query | orderBy:$ctrl.orderProp | json}}</pre>
</div>
