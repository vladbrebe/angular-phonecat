<div class="container-fluid">
  <div class="row"> <!--12 columns--> 


    <div class="col-md-2"> <!--first 2-->
      <!--Sidebar content-->

      Search: <input ng-model="$ctrl.query" /> <!--binds to controller scope-->
    </div>

    <div class="col-md-10"> <!--last 10-->
      <!--Body content-->

      <p>
        Searching {{$ctrl.query}} ...
      <ul class="phones">
        <li ng-repeat="phone in $ctrl.phones | filter:$ctrl.query">
          <span>{{phone.name}}</span>
          <p>{{phone.snippet}}</p>
        </li>
      </ul>
      </p>
    </div>


  </div>
</div>
